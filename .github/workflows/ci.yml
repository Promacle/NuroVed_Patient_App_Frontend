name: NuroVed Patient App CI

on:
  push:
    branches: [ main, nuroved/repair, 'release/**' ]
  pull_request:
    branches: [ main, nuroved/repair ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-tests:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Test Suite with Coverage
        run: flutter test --coverage

      - name: Verify Dependency Health (Outdated Check)
        run: flutter pub outdated

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage/lcov.info
          retention-days: 7

  build-validation:
    name: Build Verification (Debug APK & Web)
    runs-on: ubuntu-latest
    needs: [code-quality-and-tests]
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Build Web Target
        run: flutter build web --release

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuroved-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuroved-web-dist
          path: build/web
          retention-days: 7

  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Git Secrets / Pattern Audit
        run: |
          echo "Scanning codebase for hardcoded private keys, tokens, and credentials..."
          # Reject tracked service role keys or real secret patterns
          if git grep -inE "(eyJh[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|service_role_key|AIzaSy[A-Za-z0-9_-]{33})" -- ':!supabase/migrations' ':!test/' ':!docs/' ':!pubspec.lock'; then
            echo "::error::Potential hardcoded secret or token detected in production code!"
            exit 1
          fi
          echo "No hardcoded credentials or secret leaks detected."
